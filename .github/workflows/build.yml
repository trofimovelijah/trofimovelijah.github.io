name: Build Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate HTML from Markdown
        run: |
          python scripts/generate.py
          if [ ! -f index.html ]; then
            echo "❌ ERROR: index.html was not generated!"
            exit 1
          fi
          echo "✅ index.html generated successfully"

      - name: Copy favicon to root
        run: |
          if [ -f assets/favicon.svg ]; then
            cp assets/favicon.svg favicon.svg
            echo "✅ favicon.svg copied to root"
          else
            echo "⚠️ WARNING: assets/favicon.svg not found, skipping"
          fi

      - name: Check if files were modified
        id: check_changes
        run: |
          if git diff --quiet index.html favicon.svg 2>/dev/null; then
            echo "unchanged=true" >> $GITHUB_OUTPUT
            echo "✓ No changes"
          else
            echo "unchanged=false" >> $GITHUB_OUTPUT
            echo "✓ Files have been modified"
            git diff --stat
          fi

      - name: Configure Git
        if: steps.check_changes.outputs.unchanged == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        if: steps.check_changes.outputs.unchanged == 'false'
        run: |
          git add index.html
          git add favicon.svg 2>/dev/null || true
          git commit -m "Auto-generate index.html and copy favicon [skip ci]"
          git push

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
